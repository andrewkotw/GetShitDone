name: Split inline HTML assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-inline-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refactor-split-html-css-js
          fetch-depth: 0

      - name: Fetch backup branch
        run: git fetch origin backup-before-split:refs/remotes/origin/backup-before-split

      - name: Split inline CSS and JavaScript
        run: python3 tools/split-inline-assets.py

      - name: Commit split files
        run: |
          if git diff --quiet; then
            echo "No split changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js sw.js
          git commit -m "Split inline CSS and JavaScript"
          git push origin refactor-split-html-css-js
